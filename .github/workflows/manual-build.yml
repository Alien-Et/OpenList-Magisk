name: 标签触发打包 OpenList Magisk 模块

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 vX.Y.Z 格式的标签
      - 'v*.*.*.*'  # 匹配 vX.Y.Z.W 格式的标签
      - 'v*.*.*-*'  # 匹配 vX.Y.Z-* 格式的预发布标签

permissions:
  contents: write  # 允许创建 Release
  actions: read    # 允许读取 Actions 状态

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出仓库代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 安装依赖工具
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip jq gh

      # 获取已发布的版本信息
      - name: 获取已发布的版本信息
        id: published_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "获取已发布的版本信息..."
          
          # 尝试获取最新发布的版本
          LATEST_RELEASE=$(gh release view --json tagName 2>/dev/null || echo "{}")
          
          if [[ "$LATEST_RELEASE" != "{}" ]]; then
            PUBLISHED_VERSION=$(echo "$LATEST_RELEASE" | grep '"tagName":' | sed -E 's/.*"tagName":\s*"([^"]+)".*/\1/')
            
            # 从已发布版本中提取版本号（支持 3 位或 4 位版本号，包括预发布版本）
            VERSION_NUM=$(echo "$PUBLISHED_VERSION" | tr -d 'v' | cut -d'-' -f1)
            
            # 检查版本号位数
            VERSION_PARTS=$(echo "$VERSION_NUM" | awk -F. '{print NF}')
            
            if [ "$VERSION_PARTS" -eq 3 ]; then
              # 3 位版本号：v4.1.11 → 4111
              PUBLISHED_VERSION_CODE=$(echo "$VERSION_NUM" | awk -F. '{print $1 * 1000 + $2 * 100 + $3}')
            elif [ "$VERSION_PARTS" -eq 4 ]; then
              # 4 位版本号：v4.1.11.1 → 41111
              PUBLISHED_VERSION_CODE=$(echo "$VERSION_NUM" | awk -F. '{print $1 * 10000 + $2 * 1000 + $3 * 10 + $4}')
            else
              echo "::warning::已发布版本号格式不正确，使用 0 作为版本代码"
              PUBLISHED_VERSION_CODE=0
            fi
            
            echo "PUBLISHED_VERSION=$PUBLISHED_VERSION" >> $GITHUB_ENV
            echo "PUBLISHED_VERSION_CODE=$PUBLISHED_VERSION_CODE" >> $GITHUB_ENV
            echo "已发布版本: $PUBLISHED_VERSION (code: $PUBLISHED_VERSION_CODE)"
          else
            echo "PUBLISHED_VERSION=none" >> $GITHUB_ENV
            echo "PUBLISHED_VERSION_CODE=0" >> $GITHUB_ENV
            echo "当前无已发布版本，首次构建"
          fi

      # 从标签中提取版本信息
      - name: 从标签中提取版本信息
        id: tag_version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "标签版本: $TAG_VERSION"
          
          # 生成版本代码（支持 3 位或 4 位版本号，包括预发布版本）
          VERSION_NUM=$(echo "$TAG_VERSION" | tr -d 'v' | cut -d'-' -f1)
          
          # 检查版本号位数
          VERSION_PARTS=$(echo "$VERSION_NUM" | awk -F. '{print NF}')
          
          if [ "$VERSION_PARTS" -eq 3 ]; then
            # 3 位版本号：v4.1.11 → 4111
            TAG_VERSION_CODE=$(echo "$VERSION_NUM" | awk -F. '{print $1 * 1000 + $2 * 100 + $3}')
          elif [ "$VERSION_PARTS" -eq 4 ]; then
            # 4 位版本号：v4.1.11.1 → 41111
            TAG_VERSION_CODE=$(echo "$VERSION_NUM" | awk -F. '{print $1 * 10000 + $2 * 1000 + $3 * 10 + $4}')
          else
            echo "::error::版本号格式不正确，只支持 3 位或 4 位版本号"
            exit 1
          fi
          
          # 检查是否为预发布版本
          if [[ "$TAG_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "此标签为预发布版本"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "此标签为正式版本"
          fi
          
          echo "TAG_VERSION_CODE=$TAG_VERSION_CODE" >> $GITHUB_ENV
          echo "标签版本代码: $TAG_VERSION_CODE"

      # 比较版本号并决定是否构建
      - name: 比较版本并决定是否构建
        id: should_build
        run: |
          if [ "${{ env.PUBLISHED_VERSION }}" = "none" ]; then
            echo "首次构建，开始打包"
            echo "SHOULD_BUILD=true" >> $GITHUB_ENV
          else
            # 比较版本代码
            if [ "${{ env.TAG_VERSION_CODE }}" -gt "${{ env.PUBLISHED_VERSION_CODE }}" ]; then
              echo "标签版本 ($TAG_VERSION) 大于已发布版本 ($PUBLISHED_VERSION)，开始打包"
              echo "SHOULD_BUILD=true" >> $GITHUB_ENV
            else
              echo "标签版本 ($TAG_VERSION) 不大于已发布版本 ($PUBLISHED_VERSION)，跳过打包"
              echo "SHOULD_BUILD=false" >> $GITHUB_ENV
            fi
          fi

      # 同步 OpenList 二进制文件
      - name: 同步 OpenList 二进制文件
        if: env.SHOULD_BUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: https://api.github.com/repos/OpenListTeam/OpenList/releases/latest
        run: |
          echo "同步 OpenList 二进制文件..."
          
          # 获取 OpenList 最新版本
          for i in {1..3}; do
            RESPONSE=$(curl -s -L -w "\n%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" "$API_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" -eq 200 ] && [ -n "$BODY" ]; then
              echo "成功获取 OpenList Release 数据"
              break
            fi
            echo "尝试 $i 失败，HTTP 状态码: $HTTP_CODE"
            sleep $((5 * i))
          done
          
          # 提取下载链接
          ARM_URL=$(echo "$BODY" | grep '"browser_download_url":' | grep 'openlist-android-arm.tar.gz' | sed -E 's/.*"([^"]+)".*/\1/')
          ARM64_URL=$(echo "$BODY" | grep '"browser_download_url":' | grep 'openlist-android-arm64.tar.gz' | sed -E 's/.*"([^"]+)".*/\1/')
          
          if [ -z "$ARM_URL" ] || [ -z "$ARM64_URL" ]; then
            echo "::error::无法提取二进制下载链接"
            exit 1
          fi
          
          # 下载并解压 ARM 版本
          for i in {1..3}; do
            if curl -L -o openlist-arm.tar.gz "$ARM_URL"; then
              break
            fi
            echo "下载 ARM 版本失败，重试 $i/3"
            sleep $((5 * i))
          done
          
          if [ ! -f openlist-arm.tar.gz ]; then
            echo "::error::下载 ARM 版本失败"
            exit 1
          fi
          
          tar -xzf openlist-arm.tar.gz
          if [ ! -f openlist ]; then
            echo "::error::解压 ARM 版本失败"
            exit 1
          fi
          mv openlist openlist-arm
          rm -f openlist-arm.tar.gz
          
          # 下载并解压 ARM64 版本
          for i in {1..3}; do
            if curl -L -o openlist-arm64.tar.gz "$ARM64_URL"; then
              break
            fi
            echo "下载 ARM64 版本失败，重试 $i/3"
            sleep $((5 * i))
          done
          
          if [ ! -f openlist-arm64.tar.gz ]; then
            echo "::error::下载 ARM64 版本失败"
            exit 1
          fi
          
          tar -xzf openlist-arm64.tar.gz
          if [ ! -f openlist ]; then
            echo "::error::解压 ARM64 版本失败"
            exit 1
          fi
          mv openlist openlist-arm64
          rm -f openlist-arm64.tar.gz
          
          # 移动二进制文件到模块目录
          if [ ! -f openlist-arm ] || [ ! -f openlist-arm64 ]; then
            echo "::error::二进制文件不存在"
            exit 1
          fi
          
          mv openlist-arm OpenList-Magisk/
          mv openlist-arm64 OpenList-Magisk/
          
          # 设置权限
          chmod 755 OpenList-Magisk/openlist-arm OpenList-Magisk/openlist-arm64
          
          echo "OpenList 二进制文件同步完成！"
          
          # 更新 module.prop
          echo "更新 module.prop..."
          sed -i "s/^version=.*/version=${{ env.TAG_VERSION }}/" OpenList-Magisk/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ env.TAG_VERSION_CODE }}/" OpenList-Magisk/module.prop
          
          # 更新 update.json
          echo "更新 update.json..."
          cat > update.json << EOF
          {
              "version": "$TAG_VERSION",
              "versionCode": $TAG_VERSION_CODE,
              "zipUrl": "https://github.com/Alien-Et/OpenList-Magisk/releases/download/$TAG_VERSION/openlist-magisk-$TAG_VERSION.zip",
              "changelog": "https://github.com/Alien-Et/OpenList-Magisk/raw/main/OpenList-Magisk/CHANGELOG.md"
          }
          EOF
          
          echo "配置文件更新完成！"

      # 打包模块
      - name: 打包模块
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd OpenList-Magisk
          zip -r ../openlist-magisk-${{ env.TAG_VERSION }}.zip .
          cd ..
          
          echo "模块打包完成: openlist-magisk-${{ env.TAG_VERSION }}.zip"

      # 创建 Release
      - name: 创建 Release
        if: env.SHOULD_BUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 准备 Release 说明
          RELEASE_NOTES="OpenList Magisk 模块 ${{ env.TAG_VERSION }}"
          
          # 创建 Release（根据标签是否包含 - 决定是否为预发布版本）
          gh release create "${{ env.TAG_VERSION }}" \
            --title "OpenList Magisk Module ${{ env.TAG_VERSION }}" \
            --notes "$RELEASE_NOTES" \
            --draft=false \
            --prerelease=${{ env.IS_PRERELEASE }} \
            "openlist-magisk-${{ env.TAG_VERSION }}.zip"
          
          echo "Release 创建成功！"

      # 显示打包结果
      - name: 显示打包结果
        if: env.SHOULD_BUILD == 'true'
        run: |
          ls -la *.zip
          echo "打包完成！Release 已创建。"

      # 上传打包文件作为 Artifact
      - name: 上传打包文件
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openlist-magisk-module
          path: openlist-magisk-${{ env.TAG_VERSION }}.zip
          retention-days: 7