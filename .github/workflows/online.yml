name: 发布纯在线包

# 职责：只补一个 openlist-magisk-online.zip（不含二进制）到自己的日期版本 Release，
# 并改写 update.json。架构包由 1.yml 负责，用上游版本号，各占一个 Release，互不覆盖。
#
# 触发：手动触发，只填 8 位日期。同一天重复触发时，CI 读 update.json 里的上一版
# 自动把流水号 +1，所以一天可以发多版，你不需要自己记发到第几版。
#
# 版本号形如 2026.11.24-1、2026.11.24-2，每天从 -1 起，第二天归零。
# versionCode = Unix 日数 × 100 + (流水号 - 1)，跨天也严格递增，不会撞号。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '发布日期的 8 位数字，例如 20261124（同一天再发会自动变 -2、-3）'
        required: true
        type: string
      notes:
        description: 'Release 说明（留空则用 CHANGELOG-ONLINE.md 全文）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zip gh

      # ---------- 1. 解析版本号 ----------
      # 输入只有 8 位日期。
      #   显示版本  2026.11.24-1 / 2026.11.24-2 …（每天从 -1 起，次日归零）
      #   versionCode = Unix 日数 × 100 + (流水号 - 1)
      # 流水号基于「已发布的 Release」判定，而不是 update.json 里写了什么：
      # 只有同一天已经有同名 Release 才 +1，否则从 1 起。这样 update.json 被提前
      # 写成待发布版本时不会跳号，重跑一次也不会跳号。
      # 上限：int32 可容纳 2147 万天，约 6 万年，实际不会溢出。
      - name: 解析版本号
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          D="${{ inputs.date }}"
          if ! printf '%s' "$D" | grep -Eq '^[0-9]{8}$'; then
            echo "::error::日期格式不对：$D（应为 8 位数字，例如 20261124）"
            exit 1
          fi

          DISP=$(python3 -c "import sys,datetime;print(datetime.datetime.strptime(sys.argv[1],'%Y%m%d').strftime('%Y.%m.%d'))" "$D")
          DAYS=$(python3 -c "import sys,datetime;d=datetime.datetime.strptime(sys.argv[1],'%Y%m%d').date();print((d-datetime.date(1970,1,1)).days)" "$D")

          OLD=$(python3 -c "import json;print(json.load(open('update.json')).get('version',''))" 2>/dev/null || true)
          SEQ=1
          if [ "${OLD%-*}" = "$DISP" ] && gh release view "$OLD" >/dev/null 2>&1; then
            SEQ=$(( ${OLD##*-} + 1 ))
          fi

          VER="$DISP-$SEQ"
          CODE=$(( DAYS * 100 + SEQ - 1 ))

          {
            echo "VER=$VER"
            echo "CODE=$CODE"
            echo "SEQ=$SEQ"
          } | tee "$RUNNER_TEMP/ver.env"
          cat "$RUNNER_TEMP/ver.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/ver.env"
          echo "版本 $VER / versionCode $CODE"

      # ---------- 2. 改写 update.json ----------
      # zipUrl 直接指向该版本 Release 里的 online 包，不用 latest：
      # latest 指向最新那个 Release，可能被上游架构包抢先，那时地址就 404。
      - name: 改写 update.json
        run: |
          set -e
          cat > update.json <<EOF
          {
              "version": "${{ env.VER }}",
              "versionCode": ${{ env.CODE }},
              "zipUrl": "https://github.com/Alien-Et/OpenList-Magisk/releases/download/${{ env.VER }}/openlist-magisk-online.zip",
              "changelog": "https://raw.githubusercontent.com/Alien-Et/OpenList-Magisk/main/CHANGELOG-ONLINE.md"
          }
          EOF
          cat update.json

      # ---------- 3. 打包 online 包 ----------
      # module.prop 注入模块版本号，updateJson 指向仓库根 update.json。
      # 仓库里的 module.prop 只是模板，不跟着改。
      - name: 打包 online 包
        run: |
          set -e
          d=".pkg/online"
          rm -rf "$d"; mkdir -p "$d"
          cp -a OpenList-Magisk/. "$d/"
          rm -f "$d"/openlist-arm "$d"/openlist-arm64 "$d"/openlist-amd64 "$d"/openlist-386
          sed -i \
            -e "s|^name=.*|name=OpenList(online)|" \
            -e "s|^version=.*|version=${{ env.VER }}|" \
            -e "s|^versionCode=.*|versionCode=${{ env.CODE }}|" \
            -e "s|^channel=.*|channel=online|" \
            -e "s|^updateJson=.*|updateJson=https://raw.githubusercontent.com/Alien-Et/OpenList-Magisk/main/update.json|" \
            "$d/module.prop"
          ( cd "$d" && zip -r -q "../../openlist-magisk-online.zip" . )
          rm -rf "$d"

          echo "=== 包内检查 ==="
          unzip -p openlist-magisk-online.zip module.prop | grep -E '^(version|versionCode|updateJson)='
          echo "二进制（应为空）: $(unzip -l openlist-magisk-online.zip | grep -oE 'openlist-[a-z0-9]+$' | tr '\n' ' ')"
          printf '体积: %s 字节\n' "$(stat -c %s openlist-magisk-online.zip)"

      # ---------- 4. 提交 update.json ----------
      # 1.yml 的 paths-ignore 里有 update.json，这次提交不会触发上游同步工作流。
      - name: 提交 update.json
        run: |
          set -e
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add update.json
          git commit -m "release(online): ${{ env.VER }}" || echo "update.json 无更改"
          git push origin main

      # ---------- 5. 挂到 Release ----------
      - name: 发布 Release 资产
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ env.VER }}"
          if [ -n "${{ inputs.notes }}" ]; then
            printf '%s\n' "${{ inputs.notes }}" > release_notes.txt
          elif [ -f CHANGELOG-ONLINE.md ]; then
            cp CHANGELOG-ONLINE.md release_notes.txt
          else
            echo "OpenList 模块 $V（纯在线包）" > release_notes.txt
          fi

          if gh release view "$V" &>/dev/null; then
            echo "Release $V 已存在，追加 online 包"
            gh release upload "$V" openlist-magisk-online.zip --clobber
            echo "" >> release_notes.txt
            echo "> 纯在线包（不含二进制，安装时按设备架构自动下载）已上传。" >> release_notes.txt
            gh release edit "$V" --notes-file release_notes.txt
          else
            echo "Release $V 不存在，创建（只含 online 包）"
            echo "" >> release_notes.txt
            echo "> 这个版本目前只有纯在线包；架构包会等上游 OpenList 发布同版本后由 CI 自动补上。" >> release_notes.txt
            gh release create "$V" \
              --title "OpenList Magisk Module $V" \
              --notes-file release_notes.txt \
              --draft=false \
              --prerelease=false \
              openlist-magisk-online.zip
          fi
          echo "Release $V 处理完成"

      - name: 清理临时文件
        if: always()
        run: rm -rf .pkg openlist-magisk-online.zip release_notes.txt
